<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symphony</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdfdfd; --lane: #f5f5f6; --card: #ffffff; --card-line: #e8e8eb; --line: #ececef;
    --text: #1f2023; --text-2: #56595f; --text-3: #6c6f75; --hover: #f0f0f2; --pill: #ececef;
    --accent: #5e6ad2; --focus: #5e6ad2; --agent: #0f9d8f; --retry: #d9930d; --danger: #eb5757;
    --shadow: 0 1px 1px rgba(0, 0, 0, 0.03), 0 0 0 0.5px rgba(0, 0, 0, 0.02);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141516; --lane: #191a1c; --card: #1f2023; --card-line: #2b2c30; --line: #26272a;
      --text: #e8e9eb; --text-2: #a9acb3; --text-3: #8d9097; --hover: #24262a; --pill: #2a2b2f;
      --accent: #7c87e8; --focus: #8a94ee; --agent: #2ec4b3; --retry: #f0b43c; --danger: #f07171;
      --shadow: none; color-scheme: dark;
    }
  }
:root[data-theme="dark"] {
    --bg: #141516; --lane: #191a1c; --card: #1f2023; --card-line: #2b2c30; --line: #26272a;
    --text: #e8e9eb; --text-2: #a9acb3; --text-3: #8d9097; --hover: #24262a; --pill: #2a2b2f;
    --accent: #7c87e8; --focus: #8a94ee; --agent: #2ec4b3; --retry: #f0b43c; --danger: #f07171;
    --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: 4px; }
  svg { flex-shrink: 0; display: block; }

  /* Header */
  .head { display: flex; align-items: center; gap: 8px; padding: 12px 20px 6px; }
  .project { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 14px; }
  .project svg { color: var(--text-2); }
  .spacer { flex: 1; }
  .agents { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12px; padding: 0 6px; }
  .agents i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
  .agents.on i { background: var(--agent); }
  .agents.bad i { background: var(--danger); }
  .new { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--card-line); background: var(--card); border-radius: 6px; padding: 4px 10px; font-weight: 500; box-shadow: var(--shadow); }
  .new:hover { background: var(--hover); }

  .bar { display: flex; align-items: center; gap: 4px; padding: 4px 20px 10px; border-bottom: 1px solid var(--line); }
  .tab { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 10px; color: var(--text-2); font-weight: 500; }
  .tab:hover { background: var(--hover); color: var(--text); }
  .tab[aria-selected="true"] { background: var(--pill); color: var(--text); }
  .tool { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--text-2); border-radius: 6px; padding: 4px 8px; font-weight: 500; }
  .tool:hover, .tool[aria-expanded="true"] { background: var(--hover); color: var(--text); }
  .filter-box { display: none; align-items: center; gap: 6px; }
  .filter-box.open { display: inline-flex; }
  .filter-box input { width: 220px; border: 1px solid var(--card-line); background: var(--card); border-radius: 6px; padding: 5px 10px; }
  .filter-box input:focus { outline: none; border-color: var(--focus); }
  .alert { margin: 10px 20px 0; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--danger); color: var(--text); background: color-mix(in srgb, var(--danger) 10%, var(--bg)); white-space: pre-wrap; }

  /* Board */
  .view { flex: 1; min-height: 0; display: flex; }
  .board { flex: 1; min-height: 0; display: flex; gap: 10px; padding: 12px 20px 16px; overflow-x: auto; }
  .board[hidden], .activity[hidden] { display: none; }
  .col { flex: 0 0 332px; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .col-head { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 8px; }
  .col-head .name { font-weight: 500; }
  .col-head .count { color: var(--text-3); font-variant-numeric: tabular-nums; }
  .icon-btn { border: 0; background: transparent; color: var(--text-3); width: 24px; height: 24px; border-radius: 5px; display: inline-grid; place-items: center; }
  .icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--hover); color: var(--text); }
  .lane { flex: 1; min-height: 0; overflow-y: auto; background: var(--lane); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  .lane.drop { background: color-mix(in srgb, var(--accent) 9%, var(--lane)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
  .add-row { border: 0; background: transparent; border-radius: 6px; height: 34px; color: var(--text-3); display: grid; place-items: center; opacity: 0; flex-shrink: 0; }
  .col:hover .add-row, .add-row:focus-visible, .lane.empty .add-row { opacity: 1; }
  .add-row:hover { background: var(--hover); color: var(--text); }

  .card { background: var(--card); border: 1px solid var(--card-line); border-radius: 7px; padding: 10px 12px 10px; box-shadow: var(--shadow); cursor: pointer; flex-shrink: 0; }
  .card:hover { border-color: color-mix(in srgb, var(--text-3) 60%, var(--card-line)); }
  .card.dragging { opacity: 0.4; }
  .card.selected { border-color: var(--focus); }
  .card .key { color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; }
  .card .title { display: flex; align-items: flex-start; gap: 7px; margin-top: 4px; font-weight: 500; line-height: 1.35; }
  .card .title svg { margin-top: 1px; }
  .card .title span { overflow-wrap: anywhere; }
  .props { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border: 1px solid var(--card-line); border-radius: 999px; font-size: 11.5px; color: var(--text-2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
  .chip.running { color: var(--agent); border-color: color-mix(in srgb, var(--agent) 35%, var(--card-line)); }
  .chip.running .dot { background: var(--agent); animation: breathe 1.6s ease-in-out infinite; }
  .chip.retrying, .chip.checking { color: var(--retry); border-color: color-mix(in srgb, var(--retry) 35%, var(--card-line)); }
  .chip.retrying .dot, .chip.checking .dot { background: var(--retry); }
  .chip.parked { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--card-line)); }
  .chip.parked .dot { background: var(--danger); }
  @keyframes breathe { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .chip.running .dot { animation: none; } }
  .prio-icon { color: var(--text-2); }
  .updated { margin-top: 8px; color: var(--text-3); font-size: 12px; }

  /* Hidden columns */
  .hidden-cols { flex: 0 0 292px; padding-top: 2px; }
  .hidden-toggle { display: flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--text-2); font-weight: 500; height: 32px; padding: 0 8px; border-radius: 6px; width: 100%; text-align: left; }
  .hidden-toggle:hover { background: var(--hover); }
  .hidden-toggle svg { transition: transform 120ms ease; }
  .hidden-toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }
  .hidden-list { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .hidden-row { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 12px; border: 1px solid transparent; border-radius: 7px; background: var(--lane); width: 100%; text-align: left; font-weight: 500; }
  .hidden-row:hover { background: var(--hover); }
  .hidden-row.drop { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--lane)); }
  .hidden-row .count { margin-left: auto; color: var(--text-3); font-weight: 400; font-variant-numeric: tabular-nums; }

  /* Menus */
  .menu { position: fixed; z-index: 20; min-width: 180px; background: var(--card); border: 1px solid var(--card-line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); padding: 4px; }
  .menu[hidden] { display: none; }
  .menu button { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: transparent; padding: 6px 8px; border-radius: 5px; text-align: left; }
  .menu button:hover, .menu button:focus-visible { background: var(--hover); outline: none; }

  /* Issue detail: centered modal, reading column + properties sidebar (Linear's issue view) */
  dialog.issue { width: min(1080px, calc(100vw - 48px)); height: min(860px, calc(100vh - 64px)); max-width: none; max-height: none; overflow: hidden; }
  dialog.issue[open] { display: flex; flex-direction: column; }
  .issue-top { display: flex; align-items: center; gap: 8px; height: 48px; flex-shrink: 0; padding: 0 12px 0 24px; border-bottom: 1px solid var(--line); color: var(--text-2); }
  .issue-top .key { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .issue-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
  .issue-main { overflow-y: auto; padding: 32px 48px 40px; display: flex; flex-direction: column; gap: 28px; }
  .issue-main > * { width: 100%; max-width: 720px; }
  .issue-main h2 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.3; letter-spacing: -0.015em; overflow-wrap: anywhere; }
  .issue-side { overflow-y: auto; border-left: 1px solid var(--line); background: var(--lane); padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 22px; }
  .side-title { margin: 0 0 10px; color: var(--text-2); font-weight: 500; }
  .label .count { color: var(--text-3); font-weight: 400; margin-left: 4px; }
  .attrs { display: grid; grid-template-columns: 88px 1fr; gap: 10px 12px; align-items: center; margin: 0; }
  .attrs dt { color: var(--text-2); }
  .attrs dd { margin: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; overflow-wrap: anywhere; }
  .select { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--card-line); background: var(--card); border-radius: 6px; padding: 0 0 0 8px; }
  .select select { border: 0; background: transparent; padding: 4px 8px 4px 0; }
  .select select:focus { outline: none; }
  .note { border-radius: 7px; padding: 9px 12px; background: var(--lane); border: 1px solid var(--line); }
  .note.running { border-color: color-mix(in srgb, var(--agent) 40%, var(--line)); }
  .note.retrying, .note.checking { border-color: color-mix(in srgb, var(--retry) 40%, var(--line)); }
  .note.parked { border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
  .label { color: var(--text-2); font-weight: 500; margin: 0 0 8px; }
  .prose { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; font-size: 14px; }
  .prose code { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--pill); padding: 1px 5px; border-radius: 4px; }
  .muted { color: var(--text-2); }
  .prose.none { color: var(--text-3); }
  .activity-feed { list-style: none; margin: 0; padding: 0; }
  .activity-feed li { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .activity-feed time { color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .comment { padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; background: var(--card); }
  .comment time { display: block; color: var(--text-3); font-size: 12px; margin-bottom: 6px; }
  .composer { border: 1px solid var(--card-line); border-radius: 8px; padding: 12px 14px; background: var(--bg); }
  .composer textarea { width: 100%; border: 0; background: transparent; resize: vertical; min-height: 72px; line-height: 1.55; padding: 0; font-size: 14px; }
  .composer textarea:focus { outline: none; }
  .composer:focus-within { border-color: var(--focus); }
  .composer .row { display: flex; justify-content: flex-end; }
  .btn { border: 1px solid var(--card-line); background: var(--card); border-radius: 6px; padding: 4px 12px; font-weight: 500; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.06); }

  /* New issue */
  dialog { border: 1px solid var(--card-line); border-radius: 12px; padding: 0; width: min(640px, calc(100vw - 32px)); background: var(--card); color: var(--text); box-shadow: 0 16px 48px rgba(0, 0, 0, 0.18); }
  dialog::backdrop { background: rgba(10, 10, 12, 0.32); }
  dialog form { display: flex; flex-direction: column; }
  .dlg-top { display: flex; align-items: center; gap: 8px; padding: 14px 18px 4px; color: var(--text-2); font-weight: 500; }
  .dlg-title { border: 0; background: transparent; font-size: 18px; font-weight: 600; padding: 8px 18px 4px; }
  .dlg-desc { border: 0; background: transparent; padding: 4px 18px 12px; min-height: 110px; resize: vertical; line-height: 1.55; font-size: 14px; }
  .dlg-title:focus, .dlg-desc:focus { outline: none; }
  .dlg-props { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 18px 14px; align-items: center; }
  .dlg-props label.check { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); margin-left: 4px; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }

  /* Activity */
  .activity { flex: 1; overflow-y: auto; padding: 16px 20px 32px; }
  .stats { display: flex; flex-wrap: wrap; gap: 28px; margin: 4px 0 20px; }
  .stat b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--text-2); }
  .section { max-width: 1100px; margin-bottom: 24px; }
  .section h2 { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; color: var(--text-2); padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
  .clip { color: var(--text-2); max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nothing { color: var(--text-3); }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 7px 14px; border-radius: 8px; z-index: 30; max-width: calc(100vw - 32px); }
  .toast.error { background: var(--danger); color: #fff; }
  .toast[hidden] { display: none; }

  @media (max-width: 720px) {
    .head, .bar { padding-left: 16px; padding-right: 16px; }
    .board { padding: 10px 16px 14px; }
    .col { flex-basis: 84vw; }
    .hidden-cols { flex-basis: 84vw; }
    .filter-box input { width: 150px; }
    dialog.issue { width: 100vw; height: 100dvh; border-radius: 0; border: 0; }
    .issue-grid { display: block; overflow-y: auto; }
    .issue-main, .issue-side { overflow: visible; }
    .issue-main { padding: 22px 16px 28px; }
    .issue-side { border-left: 0; border-top: 1px solid var(--line); padding: 18px 16px 28px; }
  }
</style>
</head>
<body>
<header class="head">
  <div class="project">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span id="project">Symphony</span>
  </div>
  <span class="spacer"></span>
  <span class="agents" id="agents"><i></i><span id="agents-text">Connecting</span></span>
  <button class="icon-btn" id="theme" type="button" aria-label="Theme: system" title="Theme: system"></button>
  <button class="new" id="new" type="button">
    <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    New issue
  </button>
</header>
<nav class="bar">
  <div role="tablist" aria-label="View" style="display:flex;gap:4px">
    <button class="tab" role="tab" id="tab-board" aria-selected="true" aria-controls="board">Issues</button>
    <button class="tab" role="tab" id="tab-activity" aria-selected="false" aria-controls="activity">Activity</button>
  </div>
  <span class="spacer"></span>
  <span class="filter-box" id="filter-box"><input id="filter" type="search" placeholder="Filter by key, title or label" aria-label="Filter issues"></span>
  <button class="tool" id="filter-btn" type="button" aria-expanded="false" aria-controls="filter-box">
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 3.5h10M4 7h6M5.75 10.5h2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    Filter
  </button>
</nav>
<div class="alert" id="alert" hidden></div>

<div class="view">
  <div class="board" id="board" role="tabpanel" aria-labelledby="tab-board"></div>
  <div class="activity" id="activity" role="tabpanel" aria-labelledby="tab-activity" hidden>
    <div class="stats" id="stats"></div>
    <div class="section"><h2>Agents working</h2><div id="running"></div></div>
    <div class="section"><h2>Waiting to retry</h2><div id="retrying"></div></div>
    <div class="section"><h2>Recent runs</h2><div id="recent"></div></div>
  </div>
</div>

<div class="menu" id="menu" role="menu" hidden></div>

<dialog class="issue" id="issue" aria-labelledby="p-title">
  <div class="issue-top">
    <span id="p-crumb"></span>
    <span class="spacer"></span>
    <button class="icon-btn" id="p-close" type="button" aria-label="Close issue">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="issue-grid" id="p-body"></div>
</dialog>

<dialog id="create" aria-label="New issue">
  <form id="create-form" method="dialog">
    <div class="dlg-top"><span id="create-project"></span><span>›</span><span>New issue</span></div>
    <input class="dlg-title" name="title" required maxlength="200" autocomplete="off" placeholder="Issue title" aria-label="Issue title">
    <textarea class="dlg-desc" name="description" maxlength="20000" placeholder="Add description… The agent reads this as its brief: what should change and how you'll know it works." aria-label="Description"></textarea>
    <div class="dlg-props">
      <span class="select" id="create-state-wrap"><span id="create-state-icon"></span><select name="state" id="create-state" aria-label="Status"></select></span>
      <span class="select"><span id="create-prio-icon"></span><select name="priority" id="create-prio" aria-label="Priority"><option value="">No priority</option><option value="1">Urgent</option><option value="2">High</option><option value="3">Medium</option><option value="4">Low</option></select></span>
      <label class="check" id="create-agent-row"><input type="checkbox" name="agent" checked> Agent can pick this up</label>
    </div>
    <div class="dlg-foot">
      <button class="btn" type="button" id="create-cancel">Cancel</button>
      <button class="btn primary" type="submit" id="create-submit">Create issue</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const norm = (s) => String(s ?? '').trim().toLowerCase();
const num = (n) => Number(n ?? 0).toLocaleString();
const dur = (s) => (s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`);
const ago = (t) => { if (!t) return '—'; const s = Math.round((Date.now() - Date.parse(t)) / 1000); return s < 0 ? `in ${dur(-s)}` : `${dur(s)} ago`; };
const day = (t) => (t ? new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '');
const PRIORITY = { 1: 'Urgent', 2: 'High', 3: 'Medium', 4: 'Low' };
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

let board = null, state = null, selected = null, detail = null, dragging = false, filter = '';
let shown = new Set(store.get('symphony-shown', []));    // hidden columns the user chose to show
let hidden = new Set(store.get('symphony-hidden', []));  // visible columns the user chose to hide
let hiddenOpen = store.get('symphony-hidden-open', true);

// --- Status & priority icons (Linear's vocabulary) ---------------------------

const STATUS = {
  backlog: ['#a6a8ad', 'dashed'], todo: ['#a6a8ad', 'empty'], 'to do': ['#a6a8ad', 'empty'],
  'in progress': ['#f0bf00', 0.5], 'human review': ['#eb5757', 0.75], 'in review': ['#eb5757', 0.75],
  rework: ['#f2994a', 0.25], merging: ['#4cb782', 0.75], blocked: ['#eb5757', 'bang'],
  done: ['#5e6ad2', 'check'], canceled: ['#9a9ca2', 'x'], cancelled: ['#9a9ca2', 'x'], duplicate: ['#9a9ca2', 'x'], "won't do": ['#9a9ca2', 'x'],
};
function statusIcon(name, size = 14) {
  const key = norm(name);
  const term = board?.terminal_states.some((s) => norm(s) === key);
  const act = board?.active_states.some((s) => norm(s) === key);
  const [color, kind] = STATUS[key] ?? (term ? ['#5e6ad2', 'check'] : act ? ['#f0bf00', 0.5] : ['#a6a8ad', 'empty']);
  const ring = (extra = '') => `<circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="1.5"${extra}/>`;
  let body;
  if (kind === 'dashed') body = ring(' stroke-dasharray="1.4 1.75"');
  else if (kind === 'empty') body = ring();
  else if (kind === 'check') body = `<circle cx="7" cy="7" r="7" fill="currentColor"/><path d="M4.2 7.2l1.9 1.9 3.7-3.9" fill="none" stroke="var(--card)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  else if (kind === 'x') body = `<circle cx="7" cy="7" r="7" fill="currentColor"/><path d="M4.9 4.9l4.2 4.2M9.1 4.9l-4.2 4.2" stroke="var(--card)" stroke-width="1.5" stroke-linecap="round"/>`;
  else if (kind === 'bang') body = `<circle cx="7" cy="7" r="7" fill="currentColor"/><path d="M7 3.8v3.8" stroke="var(--card)" stroke-width="1.6" stroke-linecap="round"/><circle cx="7" cy="10" r="0.95" fill="var(--card)"/>`;
  else {
    const a = kind * 2 * Math.PI, x = 7 + 3.5 * Math.sin(a), y = 7 - 3.5 * Math.cos(a);
    body = ring() + `<path d="M7 7V3.5A3.5 3.5 0 ${kind > 0.5 ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)}Z" fill="currentColor"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 14 14" style="color:${color}" aria-hidden="true">${body}</svg>`;
}
function prioIcon(p) {
  if (p === 1) return `<svg class="prio-icon" width="14" height="14" viewBox="0 0 14 14" aria-label="Urgent"><rect x="1" y="1" width="12" height="12" rx="3" fill="#f2994a"/><path d="M7 3.8v3.7" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="7" cy="10" r="0.95" fill="#fff"/></svg>`;
  if (!PRIORITY[p]) return `<svg class="prio-icon" width="14" height="14" viewBox="0 0 14 14" aria-label="No priority"><path d="M3 7h1.5M6.25 7h1.5M9.5 7H11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  const on = { 2: 3, 3: 2, 4: 1 }[p];
  return `<svg class="prio-icon" width="14" height="14" viewBox="0 0 14 14" aria-label="${PRIORITY[p]} priority">${[0, 1, 2].map((i) => `<rect x="${2 + i * 3.5}" y="${9 - i * 3}" width="2.5" height="${3 + i * 3}" rx="1" fill="currentColor" opacity="${i < on ? 1 : 0.28}"/>`).join('')}</svg>`;
}
const plusIcon = `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`;
const dotsIcon = `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="3" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="11" cy="7" r="1.2" fill="currentColor"/></svg>`;
const caretIcon = `<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// --- Data ----------------------------------------------------------------------

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error?.message ?? `Request failed (${res.status})`);
  return data;
}
function toast(message, error = false) {
  const t = $('toast');
  t.textContent = message;
  t.className = 'toast' + (error ? ' error' : '');
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.hidden = true), error ? 6000 : 2500);
}
const allStates = () => [...board.columns, ...board.hidden_columns];
const visibleCols = () => [...board.columns.filter((c) => !hidden.has(norm(c))), ...board.hidden_columns.filter((c) => shown.has(norm(c)))];
const hiddenCols = () => [...board.columns.filter((c) => hidden.has(norm(c))), ...board.hidden_columns.filter((c) => !shown.has(norm(c)))];
const matches = (t) => !filter || [t.identifier, t.title, ...t.labels].some((v) => norm(v).includes(filter));
const ticketsIn = (c) => board.tickets.filter((t) => norm(t.state) === norm(c) && matches(t));

// --- Board -----------------------------------------------------------------------

function agentChip(a) {
  if (!a) return '';
  const label = a.kind === 'running' ? (a.stopping ? 'Agent stopping' : `Agent · turn ${a.turn}/${a.max_turns}`)
    : a.kind === 'retrying' ? `Retry ${ago(a.due_at)}` : a.kind === 'checking' ? 'Agent checking' : 'Agent paused';
  return `<span class="chip ${a.kind}" title="${esc(a.last_message ?? a.error ?? '')}"><span class="dot"></span>${esc(label)}</span>`;
}

function card(t) {
  const props = [
    PRIORITY[t.priority] ? prioIcon(t.priority) : '',
    agentChip(t.agent),
    ...t.labels.map((l) => `<span class="chip"><span class="dot"></span>${esc(l)}</span>`),
  ].filter(Boolean).join('');
  return `<article class="card${t.identifier === selected ? ' selected' : ''}" draggable="true" tabindex="0" data-id="${esc(t.identifier)}" aria-label="${esc(t.identifier)} ${esc(t.title)}, ${esc(t.state)}">
    <div class="key">${esc(t.identifier)}</div>
    <div class="title">${statusIcon(t.state)}<span>${esc(t.title)}</span></div>
    ${props ? `<div class="props">${props}</div>` : ''}
    <div class="updated">Updated ${esc(day(t.updated_at))}</div>
  </article>`;
}

function renderBoard() {
  if (!board || dragging) return;
  const order = (a, b) => (PRIORITY[a.priority] ? a.priority : 9) - (PRIORITY[b.priority] ? b.priority : 9) || String(b.updated_at).localeCompare(String(a.updated_at));
  const cols = visibleCols().map((c) => {
    const list = ticketsIn(c).sort(order);
    return `<section class="col" aria-label="${esc(c)}">
      <div class="col-head">${statusIcon(c)}<span class="name">${esc(c)}</span><span class="count">${list.length}</span><span class="spacer"></span>
        <button class="icon-btn" type="button" data-menu="${esc(c)}" aria-label="${esc(c)} options" aria-haspopup="menu" aria-expanded="false">${dotsIcon}</button>
        <button class="icon-btn" type="button" data-add="${esc(c)}" aria-label="New issue in ${esc(c)}">${plusIcon}</button>
      </div>
      <div class="lane${list.length ? '' : ' empty'}" data-state="${esc(c)}">${list.map(card).join('')}<button class="add-row" type="button" data-add="${esc(c)}" aria-label="New issue in ${esc(c)}">${plusIcon}</button></div>
    </section>`;
  }).join('');
  const hid = hiddenCols();
  const hiddenPanel = hid.length ? `<aside class="hidden-cols" aria-label="Hidden columns">
      <button class="hidden-toggle" type="button" id="hidden-toggle" aria-expanded="${hiddenOpen}">${caretIcon}Hidden columns</button>
      ${hiddenOpen ? `<div class="hidden-list">${hid.map((c) => `<button class="hidden-row" type="button" data-show="${esc(c)}" data-state="${esc(c)}" title="Show ${esc(c)} column">${statusIcon(c)}<span>${esc(c)}</span><span class="count">${ticketsIn(c).length}</span></button>`).join('')}</div>` : ''}
    </aside>` : '';
  $('board').innerHTML = cols + hiddenPanel;
}

async function move(identifier, toState) {
  const t = board.tickets.find((x) => x.identifier === identifier);
  if (!t || norm(t.state) === norm(toState)) return;
  const from = t.state;
  t.state = toState;
  renderBoard();
  if (selected === identifier) renderPanel(true, true);
  try {
    await api(`/api/v1/tickets/${encodeURIComponent(identifier)}/state`, { state: toState });
    toast(`${identifier} moved to ${toState}`);
  } catch (e) {
    t.state = from;
    renderBoard();
    toast(`Couldn't move ${identifier}: ${e.message}`, true);
  }
  refresh();
}

const boardEl = $('board');
const dropZone = (el) => el.closest('.lane, .hidden-row');
boardEl.addEventListener('dragstart', (ev) => {
  const c = ev.target.closest('.card');
  if (!c) return;
  dragging = true;
  c.classList.add('dragging');
  ev.dataTransfer.setData('text/plain', c.dataset.id);
  ev.dataTransfer.effectAllowed = 'move';
});
boardEl.addEventListener('dragend', (ev) => {
  ev.target.closest('.card')?.classList.remove('dragging');
  boardEl.querySelectorAll('.drop').forEach((z) => z.classList.remove('drop'));
  dragging = false;
});
boardEl.addEventListener('dragover', (ev) => {
  const zone = dropZone(ev.target);
  if (!zone) return;
  ev.preventDefault();
  boardEl.querySelectorAll('.drop').forEach((z) => z !== zone && z.classList.remove('drop'));
  zone.classList.add('drop');
});
boardEl.addEventListener('drop', (ev) => {
  const zone = dropZone(ev.target);
  if (!zone) return;
  ev.preventDefault();
  dragging = false;
  zone.classList.remove('drop');
  move(ev.dataTransfer.getData('text/plain'), zone.dataset.state);
});
boardEl.addEventListener('click', (ev) => {
  const t = ev.target;

  const menuBtn = t.closest('[data-menu]'); if (menuBtn) return openMenu(menuBtn);
  const show = t.closest('[data-show]');
  if (show) { const c = norm(show.dataset.show); hidden.delete(c); shown.add(c); persist(); return renderBoard(); }
  if (t.closest('#hidden-toggle')) { hiddenOpen = !hiddenOpen; store.set('symphony-hidden-open', hiddenOpen); return renderBoard(); }
  const c = t.closest('.card'); if (c) openPanel(c.dataset.id);
});
boardEl.addEventListener('keydown', (ev) => {
  const c = ev.target.closest('.card');
  if (c && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openPanel(c.dataset.id); }

function persist() { store.set('symphony-shown', [...shown]); store.set('symphony-hidden', [...hidden]); }

// --- Column menu -------------------------------------------------------------------

function openMenu(btn) {
  const col = btn.dataset.menu;
  const m = $('menu');
  m.innerHTML = `<button role="menuitem" type="button" data-act="add">${plusIcon}New issue in ${esc(col)}</button><button role="menuitem" type="button" data-act="hide">Hide column</button>`;
  const r = btn.getBoundingClientRect();

// --- Issue detail modal ----------------------------------------------------------------

// Escape first, then light formatting agents use in comments: `code` and **bold**.
const inline = (s) => esc(s).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');

function splitComments(text) {
  const [body, rest] = String(text ?? '').split(/^## Comments\s*$/m);
  const comments = rest ? rest.split(/^### (.+)$/m).slice(1).reduce((acc, v, i, arr) => (i % 2 ? acc : [...acc, { at: v.trim(), text: (arr[i + 1] ?? '').trim() }]), []) : [];
  return { body: body.trim(), comments };
}

async function openPanel(identifier) {
  selected = identifier;
  detail = null;
  panelKey = '';
  renderBoard();
  renderPanel();
  if (!$('issue').open) $('issue').showModal();
  try { detail = await api(`/api/v1/${encodeURIComponent(identifier)}`); } catch { detail = null; }
  renderPanel(true);
}
function closePanel() { if ($('issue').open) $('issue').close(); }
// Esc, ×, backdrop click and closePanel() all end here.
$('issue').addEventListener('close', () => { selected = null; renderBoard(); });
$('issue').addEventListener('click', (ev) => { if (ev.target === $('issue')) closePanel(); });

let panelKey = '';
function renderPanel(keepDraft = false, force = false) {
  const t = board?.tickets.find((x) => x.identifier === selected);
  if (!t) return closePanel();
  // Polling re-renders only on change, so an open dropdown or a half-typed comment isn't disturbed.
  const key = JSON.stringify([t, detail?.recent_events, detail?.workspace]);
  if (keepDraft && !force && key === panelKey) return;
  panelKey = key;
  const draft = keepDraft ? $('p-comment')?.value ?? '' : '';
  const hadFocus = document.activeElement?.id === 'p-comment';
  const { body, comments } = splitComments(t.description);
  const a = t.agent;
  const note = !a ? '' :
    a.kind === 'running' ? `An agent is working on this: turn ${a.turn} of ${a.max_turns}.${a.stopping ? ` Stopping: ${a.stopping}.` : ''}` :
    a.kind === 'retrying' ? `The last run failed and retries ${ago(a.due_at)}. ${a.error ?? ''}` :
    a.kind === 'checking' ? 'The last run ended. Checking whether the issue still needs work.' :
    'The agent used every turn without finishing. Move the issue back to an active column to try again.';
  const events = (detail?.recent_events ?? []).filter((e) => e.message);
  const when = (v) => {
    if (!v || Number.isNaN(Date.parse(v))) return v ?? '—';

  };

  $('p-body').innerHTML = `
    <div class="issue-main">
      <h2 id="p-title">${esc(t.title)}</h2>
      ${note ? `<div class="note ${a.kind}">${esc(note)}</div>` : ''}
      <section><p class="label">Description</p><div class="prose${body ? '' : ' none'}">${body ? inline(body) : 'No description.'}</div></section>
      ${events.length ? `<section><p class="label">Agent activity</p><ul class="activity-feed">${events.slice(0, 20).map((e) => `<li><time>${new Date(e.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</time><span>${inline(e.message)}</span></li>`).join('')}</ul></section>` : ''}
      <section>
        <p class="label">Activity${comments.length ? `<span class="count">${comments.length}</span>` : ''}</p>
        ${comments.map((c) => `<div class="comment"><time>${esc(when(c.at))}</time><div class="prose">${inline(c.text)}</div></div>`).join('') || '<p class="nothing" style="margin:0 0 10px">No comments yet. Agents post progress here.</p>'}
        <form class="composer" id="p-comment-form"><textarea id="p-comment" aria-label="Leave a comment" placeholder="Leave a comment… Agents read these when the issue is in Rework."></textarea>
          <div class="row"><button class="btn" type="submit">Comment</button></div></form>
      </section>
    </div>
    <aside class="issue-side" aria-label="Properties">
      <div>
        <p class="side-title">Properties</p>
        <dl class="attrs">
          <dt>Status</dt><dd><span class="select">${statusIcon(t.state)}<select id="p-state" aria-label="Status">${allStates().map((c) => `<option${norm(c) === norm(t.state) ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></span></dd>
          <dt>Priority</dt><dd>${prioIcon(t.priority)}${esc(PRIORITY[t.priority] ?? 'No priority')}</dd>
          <dt>Labels</dt><dd>${t.labels.length ? t.labels.map((l) => `<span class="chip"><span class="dot"></span>${esc(l)}</span>`).join('') : '<span class="muted">None</span>'}</dd>
          ${t.blocked_by.length ? `<dt>Blocked by</dt><dd>${t.blocked_by.map((b) => `${esc(b.identifier)} (${esc(b.state ?? 'missing')})`).join(', ')}</dd>` : ''}
        </dl>
      </div>
      <div>
        <p class="side-title">Agent</p>
        <dl class="attrs">
          <dt>State</dt><dd>${a ? agentChip(a) : '<span class="muted">Not working on this</span>'}</dd>
          ${detail?.attempts?.restart_count ? `<dt>Runs</dt><dd>${detail.attempts.restart_count} this session</dd>` : ''}
          ${detail?.workspace?.path ? `<dt>Workspace</dt><dd>${esc(detail.workspace.path)}</dd>` : ''}
          ${detail?.last_error ? `<dt>Last error</dt><dd>${esc(detail.last_error)}</dd>` : ''}
        </dl>
      </div>
      <div>
        <p class="side-title">Details</p>

  $('p-comment').value = draft;

  $('p-comment-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const text = $('p-comment').value.trim();
    if (!text) return;
    try {
      await api(`/api/v1/tickets/${encodeURIComponent(t.identifier)}/comments`, { text });
      $('p-comment').value = '';
      toast('Comment added');
      refresh();
    } catch (e) { toast(`Couldn't add comment: ${e.message}`, true); }
  });
}
$('p-close').addEventListener('click', closePanel);

function openCreate(stateName) {

  $('create-form').reset();
  $('create-project').textContent = board.title;
  $('create-state').innerHTML = allStates().map((c) => `<option${norm(c) === norm(stateName ?? board.columns[0]) ? ' selected' : ''}>${esc(c)}</option>`).join('');
  $('create-agent-row').hidden = !board.required_labels.length;

}
function syncCreateIcons() {

  $('create-prio-icon').innerHTML = prioIcon(Number($('create-prio').value) || null);
}
$('create-state').addEventListener('change', syncCreateIcons);
$('create-prio').addEventListener('change', syncCreateIcons);
$('new').addEventListener('click', () => openCreate());
$('create-cancel').addEventListener('click', () => $('create').close());
$('create-form').addEventListener('submit', async (ev) => {

document.addEventListener('keydown', (ev) => {
  const typing = ev.target.closest('input, textarea, select, [contenteditable]');

function table(rows, cols) {

  return `<table><thead><tr>${cols.map((c) => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function renderActivity() {
  if (!state) return;
  const t = state.agent_totals;
  $('stats').innerHTML = [
    [`${state.counts.running} of ${state.max_concurrent_agents ?? '?'}`, 'agents working'],
    [state.counts.retrying, 'waiting to retry'],
    [num(t.total_tokens), 'tokens used'],

    ['Started', (r) => ago(r.started_at)], ['Last activity', (r) => ago(r.last_event_at)],

  ]);
  $('retrying').innerHTML = table(state.retrying, [
    ['Issue', (r) => `<b>${esc(r.issue_identifier)}</b>`], ['Attempt', (r) => r.attempt], ['Due', (r) => ago(r.due_at)],
    ['Reason', (r) => `<div class="clip" title="${esc(r.error)}">${esc(r.error ?? 'Checking if more work is needed')}</div>`],
  ]);
  $('recent').innerHTML = table(state.recent, [
    ['Issue', (r) => `<b>${esc(r.identifier)}</b>`], ['Result', (r) => esc(r.outcome[0].toUpperCase() + r.outcome.slice(1))], ['When', (r) => ago(r.at)],
    ['Turns', (r) => r.turns], ['Tokens', (r) => num(r.tokens.total_tokens)], ['Note', (r) => `<div class="clip" title="${esc(r.error)}">${esc(r.error ?? '')}</div>`],
  ]);
}
function setTab(name) {
  for (const n of ['board', 'activity']) { $(`tab-${n}`).setAttribute('aria-selected', String(n === name)); $(n).hidden = n !== name; }
  store.set('symphony-tab', name);
}
$('tab-board').addEventListener('click', () => setTab('board'));
$('tab-activity').addEventListener('click', () => setTab('activity'));
if (store.get('symphony-tab', 'board') === 'activity') setTab('activity');

// --- Theme (system → light → dark), remembered per browser ---------------------------------

const THEMES = ['system', 'light', 'dark'];
const themeIcons = {
  system: `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="2.5" width="11" height="7.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 12.5h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  light: `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="2.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 1v1.4M7 11.6V13M1 7h1.4M11.6 7H13M2.8 2.8l1 1M10.2 10.2l1 1M2.8 11.2l1-1M10.2 3.8l1-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  dark: `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M11.5 8.6A5 5 0 0 1 5.4 2.5a5 5 0 1 0 6.1 6.1z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>`,
};
function applyTheme(name) {
  if (name === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = name;
  $('theme').innerHTML = themeIcons[name];
  $('theme').setAttribute('aria-label', `Theme: ${name}`);
  $('theme').title = `Theme: ${name}`;
}
let theme = store.get('symphony-theme', 'system');
applyTheme(theme);
$('theme').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; store.set('symphony-theme', theme); applyTheme(theme); });

// --- Polling -------------------------------------------------------------------------------

function renderStatus() {
  if (!state || !board) return;
  $('project').textContent = board.title;
  document.title = `${board.title} · Symphony`;
  const n = state.counts.running;
  $('agents').className = 'agents' + (state.config_error ? ' bad' : n ? ' on' : '');
  $('agents-text').textContent = state.config_error ? 'Paused: fix WORKFLOW.md' : n ? `${n} ${n === 1 ? 'agent' : 'agents'} working` : 'Agents idle';
  $('alert').hidden = !state.config_error;
  $('alert').textContent = state.config_error ? `New work is paused until WORKFLOW.md is valid again.\n${state.config_error}` : '';
}
async function refresh() {
  try {
    [state, board] = await Promise.all([api('/api/v1/state'), api('/api/v1/board')]);
    renderStatus();
    renderBoard();
    renderActivity();
    if (selected) {
      try { detail = await api(`/api/v1/${encodeURIComponent(selected)}`); } catch { detail = null; }
      renderPanel(true);
    }
  } catch {
    $('agents').className = 'agents bad';
    $('agents-text').textContent = 'Symphony is not reachable';
  }
}
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 3000);
</script>
</body>
</html>
